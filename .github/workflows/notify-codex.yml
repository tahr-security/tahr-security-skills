name: Notify Codex plugin build

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "LICENSE"
      - ".github/workflows/notify-codex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch Codex plugin build
        env:
          CODEX_BUILD_TOKEN: ${{ secrets.CODEX_BUILD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CODEX_BUILD_TOKEN:-}" ]]; then
            echo "CODEX_BUILD_TOKEN is not configured." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          endpoint="https://api.github.com/repos/tahr-security/tahr-codex-plugin/actions/workflows/build-plugin.yml/dispatches"

          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --retry 3 \
              --retry-delay 2 \
              --retry-max-time 30 \
              --retry-all-errors \
              --connect-timeout 5 \
              --max-time 15 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${CODEX_BUILD_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data '{"ref":"main"}' \
              "$endpoint"
          )" || {
            echo "Codex workflow dispatch request failed after bounded retries." >&2
            exit 1
          }

          if [[ "$http_code" != "204" ]]; then
            echo "Codex workflow dispatch was not accepted (HTTP ${http_code})." >&2
            response_body="$(python3 -c 'import json, pathlib, sys; print(json.dumps(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")[:2000]))' "$response_file")"
            echo "GitHub API response: ${response_body}" >&2
            exit 1
          fi

          echo "Codex plugin build dispatch accepted."
